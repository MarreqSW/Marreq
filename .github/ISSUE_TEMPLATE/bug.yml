name: Bug report
description: Report a reproducible problem or regression in Marreq
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please provide enough detail to reproduce the problem.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem clearly and concisely.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence of steps that reproduces the issue.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Enter ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Backend (Rust / Rocket)
        - Frontend (Handlebars / JavaScript / CSS)
        - Database / migrations
        - REST API
        - Import / export / ReqIF
        - MCP server
        - Authentication / authorization
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Marreq version or commit
      description: Provide a release, branch, or commit SHA if known.
      placeholder: e.g. main @ abc1234

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant OS, browser, deployment method, database version, or other environment details.
      placeholder: |
        OS: Ubuntu 24.04
        Browser: Firefox 130
        Deployment: Docker Compose
        PostgreSQL: 16
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste relevant logs, stack traces, or error messages. Remove secrets and credentials first.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add screenshots, related issues, or any other useful context.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed passwords, tokens, and other sensitive information from this report.
          required: true
