name: Marreq CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: coverage-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install cargo-deny
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny

      - name: Audit Rust dependencies (RustSec advisories)
        # Ignored advisories are documented in deny.toml.
        run: cargo deny check advisories

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Set up Node.js (for stylelint)
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install stylelint dependencies
        run: npm install --no-save stylelint stylelint-config-standard

      - name: Stylelint CSS files
        run: npx stylelint "frontend/static/**/*.css" --config .stylelintrc.json

      - name: Install PurgeCSS
        run: npm install --no-save purgecss

      - name: Check for unused CSS
        run: node .github/workflows/purgecss-ci.mjs

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm ci

      - name: Run SPA tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build frontend coverage summary (Markdown)
        run: node scripts/frontend-coverage-summary.mjs

      - name: Publish frontend coverage to Job Summary
        run: |
          echo "## Frontend SPA coverage" >> "$GITHUB_STEP_SUMMARY"
          cat frontend-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post frontend coverage as PR comment
        if: github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        with:
          message-id: frontend-coverage
          message-path: frontend-coverage-results.md
          repo-token: ${{ github.token }}

      - name: Upload frontend coverage HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-html
          path: frontend/coverage
          retention-days: 7

      - name: Install root test dependencies
        run: npm ci

      - name: Run legacy static JS tests
        run: npx vitest run marreq-core/tests/js

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "ci-build"
          cache-on-failure: true

      - name: Build workspace (release)
        run: cargo build --workspace --release

  mcp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install MCP dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Audit production dependencies
        working-directory: mcp-server
        run: npm audit --omit=dev --audit-level=high

      - name: Build MCP server
        working-directory: mcp-server
        run: npm run build

      - name: Run MCP tests
        working-directory: mcp-server
        run: npm test

      - name: Build MCP Docker image
        run: docker build -f mcp-server/Dockerfile .

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ensure CI .env placeholder exists
        run: test -f .env || touch .env

      - name: Validate CI Compose (no MCP secret required)
        run: |
          unset MARREQ_MCP_AUDIT_SECRET
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.ci.yml \
            config >/dev/null

      - name: Validate light Compose (no MCP secret required)
        run: |
          unset MARREQ_MCP_AUDIT_SECRET
          docker compose -f docker/docker-compose.light.yml config >/dev/null

      - name: Validate production Compose with placeholders
        env:
          ROCKET_SECRET_KEY: ci-placeholder-rocket-secret-key-32charsxx
          MARREQ_PUBLIC_BASE_URL: https://example.test
          CSRF_ALLOWED_ORIGINS: https://example.test
          MARREQ_MCP_PUBLIC_URL: https://example.test/mcp
          MARREQ_MCP_ALLOWED_HOSTS: example.test
          MARREQ_MCP_AUDIT_SECRET: ci-placeholder-mcp-audit-secret-32chars
          MARREQ_CLOUD_PUBLIC_BASE_URL: https://cloud.example.test
          MARREQ_CLOUD_MCP_PUBLIC_URL: https://cloud.example.test/mcp
          MARREQ_CLOUD_MCP_ALLOWED_HOSTS: cloud.example.test
          MARREQ_CLOUD_CSRF_ALLOWED_ORIGINS: https://cloud.example.test
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.prod.yml \
            config >/dev/null
          docker compose \
            -f docker/docker-compose.light.yml \
            -f docker/docker-compose.prod.yml \
            config >/dev/null

      - name: Reject production Compose without MCP audit secret
        env:
          ROCKET_SECRET_KEY: ci-placeholder-rocket-secret-key-32charsxx
          MARREQ_PUBLIC_BASE_URL: https://example.test
          CSRF_ALLOWED_ORIGINS: https://example.test
          MARREQ_MCP_PUBLIC_URL: https://example.test/mcp
          MARREQ_MCP_ALLOWED_HOSTS: example.test
          MARREQ_CLOUD_PUBLIC_BASE_URL: https://cloud.example.test
          MARREQ_CLOUD_MCP_PUBLIC_URL: https://cloud.example.test/mcp
          MARREQ_CLOUD_MCP_ALLOWED_HOSTS: cloud.example.test
          MARREQ_CLOUD_CSRF_ALLOWED_ORIGINS: https://cloud.example.test
        run: |
          unset MARREQ_MCP_AUDIT_SECRET
          if docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.prod.yml \
            config >/dev/null 2>&1; then
            echo "production Compose must require MARREQ_MCP_AUDIT_SECRET" >&2
            exit 1
          fi

  test-and-coverage:
    runs-on: ubuntu-latest
    env:
      # Host port must match docker/docker-compose.yml (5433:5432); diesel/tests run on the runner, not inside the db container.
      DATABASE_URL: postgres://rust:rust@127.0.0.1:5433/marreq
      # Explicit disposable opt-in for delegated OAuth PostgreSQL integration tests.
      # Do not fall back to an arbitrary developer DATABASE_URL (TRUNCATE is destructive).
      MARREQ_TEST_DATABASE_URL: postgres://rust:rust@127.0.0.1:5433/marreq
    steps:
      - uses: actions/checkout@v7

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune -af || true
          df -h

      - name: Ensure CI .env placeholder exists
        run: test -f .env || touch .env

      - name: Start database
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.ci.yml up -d db

      - name: Wait for database to be healthy
        env:
          CI_COMPOSE_OVERRIDE_FILE: docker/docker-compose.ci.yml
        run: .github/workflows/wait_for_db.sh

      - name: Set up Rust (stable + llvm-tools)
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "ci-coverage"
          cache-on-failure: true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov

      - name: Install diesel CLI
        run: cargo install diesel_cli --no-default-features --features postgres

      - name: Initialize database
        run: ./marreq-core/scripts/db_setup.sh

      - name: Run delegated OAuth PostgreSQL integration tests
        run: |
          cargo test -p marreq-core --test delegated_oauth_postgres_integration -- --nocapture

      - name: Run project deletion PostgreSQL integration tests
        run: |
          cargo test -p marreq-core --test project_delete_postgres_integration -- --nocapture

      - name: Run verification control PostgreSQL integration tests
        run: |
          cargo test -p marreq-core --test verification_control_postgres_integration -- --nocapture

      - name: Run requirement update PostgreSQL integration tests
        run: |
          cargo test -p marreq-core --test requirement_update_postgres_integration -- --nocapture

      - name: Run login rate limit PostgreSQL integration tests
        run: |
          cargo test -p marreq-core --test login_rate_limit_postgres_integration -- --nocapture

      - name: Run session expiry PostgreSQL integration tests
        run: |
          cargo test -p marreq-core --test session_expiry_postgres_integration -- --nocapture

      - name: Generate coverage reports
        run: |
          cargo cov clean --workspace
          cargo cov --workspace --no-report
          cargo cov report --cobertura --output-path coverage.xml
          cargo cov report --html --output-dir coverage_html

      - name: Build coverage summary (Markdown)
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          output: file

      - name: Publish to Job Summary
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post coverage as PR comment
        if: github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        with:
          message-id: backend-coverage
          message-path: code-coverage-results.md
          repo-token: ${{ github.token }}

      - name: Coverage gate
        run: cargo cov report --fail-under-lines 70

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage_html
          retention-days: 7
