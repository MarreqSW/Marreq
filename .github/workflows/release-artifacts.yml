name: Coordinated Marreq release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

concurrency:
  group: coordinated-product-release
  cancel-in-progress: false

jobs:
  source:
    if: github.repository == 'MarreqSW/Marreq' && github.event.created && !github.event.deleted
    runs-on: ubuntu-latest
    outputs:
      head: ${{ steps.source.outputs.head }}
      tag_object: ${{ steps.source.outputs.tag_object }}
    steps:
      - name: Authorize the annotated tag against protected main
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_AFTER: ${{ github.event.after }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object | select(.type == "tag") | .sha')
          [[ "$tag_object" =~ ^[a-f0-9]{40}$ ]]
          annotation=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")
          head=$(jq -er --arg name "$GITHUB_REF_NAME" 'select(.tag == $name and .object.type == "commit") | .object.sha' <<< "$annotation")
          [[ "$head" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EVENT_AFTER" == "$head" || "$EVENT_AFTER" == "$tag_object" ]]
          gh api "repos/$GITHUB_REPOSITORY/branches/main" |
            jq -e --arg head "$head" '.protected == true and .commit.sha == $head' >/dev/null
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "tag_object=$tag_object" >> "$GITHUB_OUTPUT"

  rust:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.head }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coordinated-release
          save-if: false
      - name: Install pinned contract tooling
        run: |
          npm ci
          scripts/install-oasdiff.sh
      - name: Format, lint and audit the exact release source
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo deny check advisories
          npm audit --omit=dev --audit-level=high
      - name: Test Rust, contract inventory and release invariants
        run: |
          cargo test --locked --workspace
          python3 scripts/test-release-impact.py
          python3 scripts/test-deployment-provenance.py
          python3 scripts/test-coordinated-release.py
          python3 scripts/test-release-build-context.py
          python3 scripts/check-migration-policy.py
      - name: Check authoritative package versions
        run: |
          cargo run --locked -p marreq-release -- check
          cargo run --locked -p marreq-release -- sync --check

  plan:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.plan.outputs.artifact-id }}
    env:
      RELEASE_HEAD: ${{ needs.source.outputs.head }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install locked consumer dependencies and standards tooling
        run: |
          npm ci
          npm ci --prefix frontend
          npm ci --prefix mcp-server
          scripts/install-oasdiff.sh
          cargo build --locked -p marreq-release -p marreq-contracts
      - name: Plan publication and verify both selected artifact combinations
        env:
          GH_TOKEN: ${{ github.token }}
          MARREQ_BOOTSTRAP_TAG: ${{ vars.MARREQ_BOOTSTRAP_TAG }}
          RELEASE_WORK: ${{ runner.temp }}/release-validation
        run: scripts/coordinated-release.sh plan
      - name: Audit, test and build the consumers
        run: |
          for consumer in frontend mcp-server; do
            npm audit --prefix "$consumer" --omit=dev --audit-level=high
            npm test --prefix "$consumer"
            npm run build --prefix "$consumer"
          done
          npx --no-install vitest run marreq-core/tests/js
          node scripts/generate-api-types.mjs --check
      - name: Validate the source contracts and exercise both backend variants over HTTP
        run: |
          target/debug/marreq-contracts validate
          scripts/test-api-contracts.sh
      - uses: actions/upload-artifact@v7
        id: plan
        with:
          name: validated-release-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-validation/plan.json
            ${{ runner.temp }}/release-validation/notes.md
            ${{ runner.temp }}/release-validation/assets/*.json
          if-no-files-found: error

  publish:
    needs: [source, rust, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release-publication
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_HEAD: ${{ needs.source.outputs.head }}
      TAG_OBJECT: ${{ needs.source.outputs.tag_object }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Build the release asset assembler
        run: cargo build --locked -p marreq-release
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-publication
          merge-multiple: true
          digest-mismatch: error
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Stage, verify, and finalize the release
        env:
          GH_TOKEN: ${{ github.token }}
          MARREQ_RELEASE_POLICY_TOKEN: ${{ secrets.MARREQ_RELEASE_POLICY_TOKEN }}
          MARREQ_SOURCE_TAG_TOKEN: ${{ secrets.MARREQ_SOURCE_TAG_TOKEN }}
          RELEASE_WORK: ${{ runner.temp }}/release-publication
        run: scripts/coordinated-release.sh publish
