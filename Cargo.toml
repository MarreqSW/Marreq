# Virtual workspace: three-crate split — marreq-core (lib), marreq-server (bin), marreq-cloud (bin).
[workspace]
resolver = "2"
members = ["marreq-core", "marreq-server", "marreq-cloud"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
authors = [
    "Màrius Montón <marius.monton@gmail.com>",
    "Ramon Vallés <vallespuigramon@gmail.com>",
]

# Centralised dependency versions. Member crates reference these via
# `dep = { workspace = true }`, optionally adding extra `features` locally.
# Feature sets declared here are the union of what the member crates need.
[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.6"
base64 = "0.23"
calamine = "0.36"
chrono = { version = "0.4.44", features = ["serde"] }
csv = "1.4"
diesel = { version = "2.3.6", features = ["postgres", "chrono", "r2d2", "serde_json"] }
dotenvy = "0.15.7"
# Magic-byte file type detection for attachment uploads (no CFB/legacy Office).
infer = { version = "0.22", default-features = false }
lazy_static = "1.5"
openidconnect = { version = "4.0.1", features = ["reqwest"] }
oauth2 = { version = "5.0.0", features = ["reqwest"] }
lettre = { version = "0.11.20", features = ["builder", "smtp-transport", "tokio1-native-tls"] }
pgvector = { version = "0.4.1", features = ["diesel"] }
printpdf = "0.12.8"
quick-xml = { version = "0.42", features = ["serialize"] }
rand = "0.10"
regex = "1.12"
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
rocket = { version = "0.5.1", default-features = false, features = ["json", "secrets"] }
rocket_sync_db_pools = { version = "0.1.0", features = ["diesel_postgres_pool"] }
serde = "1.0"
serde_json = "1.0"
sha2 = "0.11"
similar = "3.2"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process"] }
urlencoding = "2.1"
url = "2.5"
rust_xlsxwriter = "0.99"
# Report documents rendered to PDF (issue #354).
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
# ReqIFZ archives. Same version and features calamine/rust_xlsxwriter already pull in.
zip = { version = "8.6", default-features = false, features = ["deflate"] }
# Admin backup archive: SQL dump plus attachment files (issue #341).
flate2 = "1"
tar = "0.4"

# Dev/test builds: keep file:line in backtraces but drop full debug info, and
# skip it for dependencies. Test binaries shrink several-fold and link much
# faster. Release builds are unaffected.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
