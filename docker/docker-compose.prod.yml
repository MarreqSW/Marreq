# Production hardening for the split SPA stack.
#
# Use together with either docker/docker-compose.yml (full stack with Ollama) or
# docker/docker-compose.light.yml (no Ollama). TLS is intentionally terminated
# by an external reverse proxy (Caddy, nginx, Traefik, etc.) which forwards to
# the loopback-bound frontend port.
#
# Full-stack example:
#   docker compose \
#     -f docker/docker-compose.yml \
#     -f docker/docker-compose.prod.yml \
#     up -d --build db ollama marreq-server frontend
#
# Light-stack example:
#   docker compose \
#     -f docker/docker-compose.light.yml \
#     -f docker/docker-compose.prod.yml \
#     up -d --build db marreq-server frontend

services:
  marreq-server:
    environment:
      # Production must never use the development fallback key.
      ROCKET_SECRET_KEY: ${ROCKET_SECRET_KEY:?Set ROCKET_SECRET_KEY in .env for production}
      MARREQ_SECURE_SESSION_COOKIE: '1'
      MARREQ_PUBLIC_BASE_URL: ${MARREQ_PUBLIC_BASE_URL:?Set MARREQ_PUBLIC_BASE_URL to the public HTTPS origin}
      CSRF_ALLOWED_ORIGINS: ${CSRF_ALLOWED_ORIGINS:?Set CSRF_ALLOWED_ORIGINS to the public HTTPS origin}
      MARREQ_MCP_AUDIT_SECRET: ${MARREQ_MCP_AUDIT_SECRET:?Set MARREQ_MCP_AUDIT_SECRET to a random value of at least 32 characters}

  mcp-server:
    environment:
      MARREQ_MCP_PUBLIC_URL: ${MARREQ_MCP_PUBLIC_URL:?Set MARREQ_MCP_PUBLIC_URL to the public HTTPS /mcp URL}
      MARREQ_MCP_ALLOWED_HOSTS: ${MARREQ_MCP_ALLOWED_HOSTS:?Set MARREQ_MCP_ALLOWED_HOSTS to the public hostname}
      MARREQ_MCP_AUDIT_SECRET: ${MARREQ_MCP_AUDIT_SECRET:?Set MARREQ_MCP_AUDIT_SECRET to a random value of at least 32 characters}

  # Keep Adminer opt-in in production. Start it explicitly with --profile admin
  # and access it only through the host loopback interface / SSH tunnel.
  adminer:
    profiles: ["admin"]

  marreq-cloud:
    environment:
      ROCKET_SECRET_KEY: ${ROCKET_SECRET_KEY:?Set ROCKET_SECRET_KEY in .env for production}
      MARREQ_SECURE_SESSION_COOKIE: '1'
      MARREQ_PUBLIC_BASE_URL: ${MARREQ_CLOUD_PUBLIC_BASE_URL:?Set MARREQ_CLOUD_PUBLIC_BASE_URL to the cloud public HTTPS origin}
      MARREQ_MCP_PUBLIC_URL: ${MARREQ_CLOUD_MCP_PUBLIC_URL:?Set MARREQ_CLOUD_MCP_PUBLIC_URL to the cloud public HTTPS /mcp URL}
      CSRF_ALLOWED_ORIGINS: ${MARREQ_CLOUD_CSRF_ALLOWED_ORIGINS:?Set MARREQ_CLOUD_CSRF_ALLOWED_ORIGINS to the cloud public HTTPS origin}
      MARREQ_MCP_AUDIT_SECRET: ${MARREQ_MCP_AUDIT_SECRET:?Set MARREQ_MCP_AUDIT_SECRET to a random value of at least 32 characters}

  mcp-cloud:
    environment:
      MARREQ_MCP_PUBLIC_URL: ${MARREQ_CLOUD_MCP_PUBLIC_URL:?Set MARREQ_CLOUD_MCP_PUBLIC_URL to the cloud public HTTPS /mcp URL}
      MARREQ_MCP_ALLOWED_HOSTS: ${MARREQ_CLOUD_MCP_ALLOWED_HOSTS:?Set MARREQ_CLOUD_MCP_ALLOWED_HOSTS to the cloud public hostname}
      MARREQ_MCP_AUDIT_SECRET: ${MARREQ_MCP_AUDIT_SECRET:?Set MARREQ_MCP_AUDIT_SECRET to a random value of at least 32 characters}
