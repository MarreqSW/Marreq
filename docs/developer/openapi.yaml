components:
  securitySchemes:
    cookieAuth:
      {
        type: apiKey,
        in: cookie,
        name: session,
        description: Rocket private session; __Host-session on secure deployments. Mutations require X-CSRF-Token.
      }
    bearerAuth:
      {
        type: http,
        scheme: bearer,
        description: 'Personal API token or delegated OAuth access token; project membership, domain scopes and
          project permissions apply.'
      }
    mcpServiceAuth:
      {
        type: apiKey,
        in: header,
        name: X-Marreq-Mcp-Audit-Secret,
        description: Private service-to-service audit secret; never browser or delegated caller configuration.
      }
  schemas:
    SemanticSearchResult:
      type: object
      properties:
        id: { type: integer }
        rank: { type: integer }
        lexical_rank: { type: integer }
        vector_rank: { type: integer }
        reference_code: { type: string }
        title: { type: string }
        description: { type: string }
        snippet: { type: string }
        status: { type: string }
        category: { type: string }
        applicability: { type: string }
        verification: { type: string }
        score: { type: number }
      required:
        - id
        - rank
        - reference_code
        - title
        - description
        - snippet
        - status
        - category
        - applicability
        - verification
        - score
      additionalProperties: true
    RagAnswerResponse:
      type: object
      properties:
        answer: { type: string }
        citations:
          type: array
          items:
            type: object
            properties: { requirement_id: { type: integer }, reference_code: { type: string }, title: { type: string } }
            required: [ requirement_id, reference_code, title ]
            additionalProperties: true
        results: { type: array, items: { $ref: "#/components/schemas/SemanticSearchResult" } }
      required: [ answer, citations, results ]
      additionalProperties: true
    OAuthTokenRequest:
      oneOf:
        - type: object
          properties:
            client_id: { type: string }
            resource: { type: string }
            grant_type: { type: string, const: authorization_code }
            code: { type: string }
            redirect_uri: { type: string }
            code_verifier: { type: string }
            refresh_token: { type: string }
          required: [ grant_type, client_id, resource, code, redirect_uri, code_verifier ]
          additionalProperties: true
        - type: object
          properties:
            client_id: { type: string }
            resource: { type: string }
            grant_type: { type: string, const: refresh_token }
            refresh_token: { type: string }
            code: { type: string }
            redirect_uri: { type: string }
            code_verifier: { type: string }
          required: [ grant_type, client_id, resource, refresh_token ]
          additionalProperties: true
    ReportDefinition:
      type: object
      properties:
        report_type: { type: string, enum: [ vcd, coverage ] }
        document:
          type: object
          properties:
            doc_id: { type: string }
            title: { type: string }
            issue: { type: string }
            revision: { type: string }
            classification: { type: string }
            watermark: { anyOf: [ { type: string }, { type: "null" } ] }
            page_size: { type: string, enum: [ a4, letter ] }
            pdf_a: { type: boolean }
            signatories:
              type: array
              items:
                type: object
                properties: { role: { type: string }, name: { type: string } }
                required: [ role, name ]
                additionalProperties: true
            change_record:
              type: array
              items:
                type: object
                properties: { issue: { type: string }, date: { type: string }, changes: { type: string }, author: { type: string } }
                required: [ issue, date, changes, author ]
                additionalProperties: true
            documents:
              type: array
              items:
                type: object
                properties: { ref: { type: string }, id: { type: string }, title: { type: string }, issue: { type: string } }
                required: [ ref, id, title, issue ]
                additionalProperties: true
          required:
            - doc_id
            - title
            - issue
            - revision
            - classification
            - watermark
            - page_size
            - pdf_a
            - signatories
            - change_record
            - documents
          additionalProperties: true
        sections:
          type: array
          items:
            type: object
            properties: { key: { type: string }, enabled: { type: boolean }, options: { type: object, additionalProperties: true } }
            required: [ key, enabled ]
            additionalProperties: true
      required: [ report_type, document, sections ]
      additionalProperties: true
    ReportDefinitionInput:
      type: object
      properties:
        report_type: { type: string, enum: [ vcd, coverage ] }
        document:
          type: object
          properties:
            doc_id: { type: string }
            title: { type: string }
            issue: { type: string }
            revision: { type: string }
            classification: { type: string }
            watermark: { anyOf: [ { type: string }, { type: "null" } ] }
            page_size: { type: string, enum: [ a4, letter ] }
            pdf_a: { type: boolean }
            signatories:
              type: array
              items:
                type: object
                properties: { role: { type: string }, name: { type: string } }
                required: []
                additionalProperties: false
            change_record:
              type: array
              items:
                type: object
                properties: { issue: { type: string }, date: { type: string }, changes: { type: string }, author: { type: string } }
                required: []
                additionalProperties: false
            documents:
              type: array
              items:
                type: object
                properties: { ref: { type: string }, id: { type: string }, title: { type: string }, issue: { type: string } }
                required: []
                additionalProperties: false
          required: []
          additionalProperties: false
        sections:
          type: array
          items:
            type: object
            properties: { key: { type: string }, enabled: { type: boolean }, options: { type: object, additionalProperties: {} } }
