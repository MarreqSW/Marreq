components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: session, description: Rocket private session; __Host-session on
        secure deployments. Mutations require X-CSRF-Token.}
    bearerAuth: {type: http, scheme: bearer, description: 'Personal API token or delegated OAuth access token; project
        membership, domain scopes and project permissions apply.'}
    mcpServiceAuth: {type: apiKey, in: header, name: X-Marreq-Mcp-Audit-Secret, description: Private service-to-service
        audit secret; never browser or delegated caller configuration.}
  schemas:
    external_ProviderDiscovery_response:
      type: object
      properties:
        password_enabled: {type: boolean}
        external:
          type: array
          items: {$ref: '#/components/schemas/external_PublicAuthProvider_response'}
      additionalProperties: true
      required: [password_enabled, external]
    external_PublicAuthProvider_response:
      type: object
      properties:
        id: {type: string}
        display_name: {type: string}
      additionalProperties: true
      required: [id, display_name]
    entities_User_response:
      type: object
      properties:
        id: {type: integer}
        username: {type: string}
        name: {type: string}
        email: {type: string}
        creation_date: {type: string}
        last_login: {type: string}
        is_admin: {type: boolean}
        email_verified: {type: boolean}
      additionalProperties: true
      required: [id, username, name, email, creation_date, last_login, is_admin, email_verified]
    use_cases_UseCaseRow_response:
      type: object
      properties:
        id: {type: integer}
        reference_code: {type: string}
        title: {type: string}
        primary_actor:
          anyOf:
          - {type: string}
          - {type: 'null'}
        step_count: {type: integer}
        alternative_count: {type: integer}
        exception_count: {type: integer}
        approval_state:
          anyOf:
          - {type: string}
          - {type: 'null'}
        current_version_number:
          anyOf:
          - {type: integer}
          - {type: 'null'}
        has_draft: {type: boolean}
        link_count: {type: integer}
        suspect_count: {type: integer}
        updated_at: {type: string}
      additionalProperties: true
      required: [id, reference_code, title, primary_actor, step_count, alternative_count, exception_count, approval_state,
        current_version_number, has_draft, link_count, suspect_count, updated_at]
    use_cases_NextCode_response:
      type: object
      properties:
        reference_code: {type: string}
      additionalProperties: true
      required: [reference_code]
    use_cases_UseCaseDetail_response:
      type: object
      properties:
        id: {type: integer}
        project_id: {type: integer}
        reference_code: {type: string}
        title: {type: string}
        created_by:
          anyOf:
          - {type: integer}
          - {type: 'null'}
        created_at: {type: string}
        updated_at: {type: string}
        current_version:
