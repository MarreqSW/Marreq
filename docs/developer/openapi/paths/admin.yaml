/api/cache/stats:
  get:
    operationId: cache_stats
    description: >-
      Audited against api/cache.rs, repository/cache/stats.rs and auth/guards/admin.rs. Session administrator
      only; identical in Server and Cloud.
    security:
      - cookieAuth: []
    x-marreq-authorization: instance-admin
    responses:
      '200':
        description: Success
        content: {application/json: {schema: {$ref: ../schemas/admin.yaml#/CacheStats}}}
      '401':
        description: Missing or expired session; guard response may be empty.
      '403':
        description: Not an administrator, or CSRF check failed; body may be framework-generated.
      '500':
        $ref: ../components/responses.yaml#/ApiError
