/oauth/authorize:
  get:
    operationId: oauth_authorize_page
    parameters:
      - in: query
        name: response_type
        schema: {type: string}
        required: true
      - in: query
        name: client_id
        schema: {type: string}
        required: true
      - in: query
        name: redirect_uri
        schema: {type: string}
        required: true
      - in: query
        name: scope
        schema: {type: string}
        required: true
      - in: query
        name: state
        schema: {type: string}
        required: true
      - in: query
        name: code_challenge
        schema: {type: string}
        required: true
      - in: query
        name: code_challenge_method
        schema: {type: string}
        required: true
      - in: query
        name: resource
        schema: {type: string}
        required: true
    responses:
      '200':
        description: HTML consent form for an authenticated browser.
        content: {text/html: {schema: {type: string}}}
      '303':
        description: 303 redirect to login or the validated OAuth redirect_uri.
        headers: {Location: {required: true, schema: {type: string}}}
      '400':
        $ref: ../components/responses.yaml#/ApiError
      '401':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '403':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '404':
        $ref: ../components/responses.yaml#/ApiError
      '409':
        $ref: ../components/responses.yaml#/ApiError
      '422':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '500':
        $ref: ../components/responses.yaml#/ApiError
    description: >-
      Audited api/oauth.rs authorize_page/checked_request. Trusted redirect errors and anonymous login return
      303; consent returns HTML. Unknown clients and invalid untrusted requests return API errors. Same in
      both variants.
    security: []
    x-marreq-authorization: validated-client-redirect-resource-pkce-scopes;optional-session-consent
  post:
    operationId: oauth_authorize_decision
    parameters: []
    responses:
      '303':
        description: 303 redirect to login or the validated OAuth redirect_uri.
        headers: {Location: {required: true, schema: {type: string}}}
      '400':
        $ref: ../components/responses.yaml#/ApiError
      '401':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '403':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '404':
        $ref: ../components/responses.yaml#/ApiError
      '409':
        $ref: ../components/responses.yaml#/ApiError
      '422':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '500':
        $ref: ../components/responses.yaml#/ApiError
    description: >-
      Audited api/oauth.rs ConsentForm and authorize_decision. Form submissions use the session and
      origin/CSRF fairing policy; both allow and deny redirect with OAuth state/issuer. Shared in both
      variants.
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded: {schema: {type: object, properties: {client_id: {type: string}, redirect_uri: {type: string}, scope: {type: string}, state: {type: string}, code_challenge: {type: string}, resource: {type: string}, decision: {type: string}}, required: [client_id, redirect_uri, scope, state, code_challenge, resource, decision], additionalProperties: true}}
