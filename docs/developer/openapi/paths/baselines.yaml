/api/projects/{project_id}/baselines:
  get:
    operationId: baselines_list
    parameters:
      - in: path
        name: project_id
        required: true
        schema: {type: integer}
    responses:
      '200':
        description: Success
        content: {application/json: {schema: {type: array, items: {$ref: ../schemas/baselines.yaml#/Baseline}}}}
      '400':
        $ref: ../components/responses.yaml#/ApiError
      '401':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '403':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '404':
        $ref: ../components/responses.yaml#/ApiError
      '409':
        $ref: ../components/responses.yaml#/ApiError
      '422':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '500':
        $ref: ../components/responses.yaml#/ApiError
    description: >-
      Audited api/baselines.rs, BaselineService and baseline models. Immutable snapshots with nullable source
      view metadata. Both variants enforce project boundaries. Optional Idempotency-Key applies to create.
    security:
      - cookieAuth: []
      - bearerAuth: []
    x-marreq-bearer-scopes:
      - baselines:read
    x-marreq-authorization: project-membership;ViewRequirements
  post:
    operationId: baselines_create
    parameters:
      - in: path
        name: project_id
        required: true
        schema: {type: integer}
      - in: header
        name: Idempotency-Key
        required: false
        schema: {type: string}
        description: Optional replay identity, trimmed then validated as 1–200 ASCII letters, digits, dot, underscore or hyphen. Reuse with a different payload returns 409.
    responses:
      '200':
        description: Success
        content: {application/json: {schema: {$ref: ../schemas/baselines.yaml#/Baseline}}}
      '400':
        $ref: ../components/responses.yaml#/ApiError
      '401':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '403':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '404':
        $ref: ../components/responses.yaml#/ApiError
      '409':
        $ref: ../components/responses.yaml#/ApiError
      '422':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '500':
        $ref: ../components/responses.yaml#/ApiError
    description: >-
      Audited api/baselines.rs, BaselineService and baseline models. Immutable snapshots with nullable source
      view metadata. Both variants enforce project boundaries. Optional Idempotency-Key applies to create.
    security:
      - cookieAuth: []
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json: {schema: {type: object, properties: {name: {type: string}, description: {anyOf: [{type: string}, {type: 'null'}]}, saved_view_id: {anyOf: [{type: integer}, {type: 'null'}]}}, required: [name], additionalProperties: true}}
    x-marreq-bearer-scopes:
      - baselines:write
    x-marreq-authorization: project-membership;EditRequirements;visible-saved-view;not-archived
    x-marreq-csrf: session-csrf
