/api/notifications:
  get:
    operationId: notifications_list
    parameters:
      - in: query
        name: unread_only
        schema: {type: boolean}
        required: false
      - in: query
        name: limit
        schema: {type: integer}
        required: false
    responses:
      '200':
        description: Success
        content: {application/json: {schema: {type: array, items: {$ref: ../schemas/projects.yaml#/Notification}}}}
      '400':
        $ref: ../components/responses.yaml#/ApiError
      '401':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '403':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '404':
        $ref: ../components/responses.yaml#/ApiError
      '409':
        $ref: ../components/responses.yaml#/ApiError
      '422':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '500':
        $ref: ../components/responses.yaml#/ApiError
    description: >-
      Audited api/notifications.rs, NotificationService and notification models. Session-only, scoped to the
      current user in both variants.
    security:
      - cookieAuth: []
    x-marreq-authorization: session-user-owned
