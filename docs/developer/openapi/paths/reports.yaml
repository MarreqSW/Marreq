/api/projects/{project_id}/reports/{file}:
  post:
    operationId: reports_generate
    parameters:
      - in: path
        name: project_id
        required: true
        schema: {type: integer}
      - in: path
        name: file
        required: true
        schema: {type: string}
    responses:
      '200':
        description: File download; Content-Disposition supplies the filename.
        headers: {Content-Disposition: {required: true, schema: {type: string}}}
        content: {application/pdf: {schema: {type: string, format: binary}}, application/vnd.oasis.opendocument.text: {schema: {type: string, format: binary}}}
      '400':
        $ref: ../components/responses.yaml#/ApiError
      '401':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '403':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '404':
        $ref: ../components/responses.yaml#/ApiError
      '409':
        $ref: ../components/responses.yaml#/ApiError
      '422':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '500':
        $ref: ../components/responses.yaml#/ApiError
    description: >-
      Audited api/reports.rs, reports/definition.rs and reports/sections.rs. Session/personal token; delegated
      OAuth denied. Both variants enforce project view permission, private-template visibility, owner/admin
      mutation rules and archived-project write denial. Definition defaults and optional section options
      follow Serde.
    security:
      - cookieAuth: []
      - bearerAuth: []
    requestBody:
      required: false
      content:
        application/json: {schema: {type: object, properties: {template_id: {anyOf: [{type: integer}, {type: 'null'}]}, definition: {anyOf: [{$ref: ../schemas/reports.yaml#/ReportDefinitionInput}, {type: 'null'}]}}, required: [], additionalProperties: true}}
    x-marreq-authorization: personal-token-or-session;delegated-denied;project-membership;ViewRequirements;visible-template
    x-marreq-csrf: session-csrf
