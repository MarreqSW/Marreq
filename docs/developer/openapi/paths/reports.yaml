/api/projects/{project_id}/reports/types:
  get:
    operationId: reports_list_types
    parameters:
      - in: path
        name: project_id
        required: true
        schema: {type: integer}
    responses:
      '200':
        description: Success
        content: {application/json: {schema: {type: array, items: {type: object, properties: {key: {type: string}, title: {type: string}, description: {type: string}, formats: {type: array, items: {type: string, enum: [pdf, odt]}}, sections: {type: array, items: {$ref: ../schemas/reports.yaml#/ReportSectionSpec}}, default_definition: {$ref: ../schemas/reports.yaml#/ReportDefinition}}, required: [key, title, description, formats, sections, default_definition], additionalProperties: true}}}}
      '400':
        $ref: ../components/responses.yaml#/ApiError
      '401':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '403':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '404':
        $ref: ../components/responses.yaml#/ApiError
      '409':
        $ref: ../components/responses.yaml#/ApiError
      '422':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '500':
        $ref: ../components/responses.yaml#/ApiError
    description: >-
      Audited api/reports.rs, reports/definition.rs and reports/sections.rs. Session/personal token; delegated
      OAuth denied. Both variants enforce project view permission, private-template visibility, owner/admin
      mutation rules and archived-project write denial. Definition defaults and optional section options
      follow Serde.
    security:
      - cookieAuth: []
      - bearerAuth: []
    x-marreq-authorization: personal-token-or-session;delegated-denied;project-membership;ViewRequirements
