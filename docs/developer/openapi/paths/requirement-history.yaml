/api/projects/{project_id}/requirements/{requirement_id}/comments:
  get:
    operationId: comments_list_by_project
    parameters:
      - in: path
        name: project_id
        required: true
        schema: {type: integer}
      - in: path
        name: requirement_id
        required: true
        schema: {type: integer}
      - in: query
        name: version_id
        schema: {type: integer}
        required: false
    responses:
      '200':
        description: Success
        content: {application/json: {schema: {type: array, items: {$ref: ../schemas/common.yaml#/CommentResponse}}}}
      '400':
        $ref: ../components/responses.yaml#/ApiError
      '401':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '403':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '404':
        $ref: ../components/responses.yaml#/ApiError
      '409':
        $ref: ../components/responses.yaml#/ApiError
      '422':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '500':
        $ref: ../components/responses.yaml#/ApiError
    description: >-
      Audited api/comments.rs and CommentService. Immutable comments, nullable version binding, author
      display-name fallback. Scoped create supports idempotency; legacy route uses session only. Shared in
      both variants.
    security:
      - cookieAuth: []
      - bearerAuth: []
    x-marreq-bearer-scopes:
      - requirements:read
    x-marreq-authorization: project-membership;ViewRequirements
  post:
    operationId: comments_create_by_project
    parameters:
      - in: path
        name: project_id
        required: true
        schema: {type: integer}
      - in: path
        name: requirement_id
        required: true
        schema: {type: integer}
      - in: header
        name: Idempotency-Key
        required: false
        schema: {type: string}
        description: Optional replay identity, trimmed then validated as 1–200 ASCII letters, digits, dot, underscore or hyphen. Reuse with a different payload returns 409.
    responses:
      '201':
        description: Success
        content: {application/json: {schema: {$ref: ../schemas/common.yaml#/CommentResponse}}}
      '400':
        $ref: ../components/responses.yaml#/ApiError
      '401':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '403':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '404':
        $ref: ../components/responses.yaml#/ApiError
      '409':
        $ref: ../components/responses.yaml#/ApiError
      '422':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '500':
        $ref: ../components/responses.yaml#/ApiError
    description: >-
      Audited api/comments.rs and CommentService. Immutable comments, nullable version binding, author
      display-name fallback. Scoped create supports idempotency; legacy route uses session only. Shared in
      both variants.
    security:
      - cookieAuth: []
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json: {schema: {type: object, properties: {body: {type: string}, requirement_version_id: {anyOf: [{type: integer}, {type: 'null'}]}}, required: [body], additionalProperties: true}}
    x-marreq-bearer-scopes:
      - requirements:write
    x-marreq-authorization: project-membership;EditRequirements;not-archived;approved-version-comment-lock-policy
    x-marreq-csrf: session-csrf
