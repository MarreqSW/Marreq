/api/projects/{project_id}/dsm:
  get:
    operationId: dsm_get_dsm
    parameters:
      - in: path
        name: project_id
        required: true
        schema: {type: integer}
      - in: query
        name: link_types
        schema: {type: string}
        required: false
      - in: query
        name: category_id
        schema: {type: integer}
        required: false
      - in: query
        name: root_id
        schema: {type: integer}
        required: false
      - in: query
        name: order
        schema: {type: string, enum: [hierarchy, partition]}
        required: false
    responses:
      '200':
        description: Success
        content: {application/json: {schema: {$ref: ../schemas/traceability.yaml#/Dsm}}}
      '400':
        $ref: ../components/responses.yaml#/ApiError
      '401':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '403':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '404':
        $ref: ../components/responses.yaml#/ApiError
      '409':
        $ref: ../components/responses.yaml#/ApiError
      '422':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '500':
        $ref: ../components/responses.yaml#/ApiError
    description: >-
      Audited api/dsm.rs and dsm_service.rs output structs. Comma-separated link types, optional project
      category/root, hierarchy or partition order; numeric indices and loop paths are preserved. Shared in
      both variants.
    security:
      - cookieAuth: []
      - bearerAuth: []
    x-marreq-bearer-scopes:
      - requirements:read
      - traceability:read
    x-marreq-authorization: project-membership;ViewRequirements
