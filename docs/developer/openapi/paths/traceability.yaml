/api/projects/{project_id}/requirement-version-links:
  post:
    operationId: requirement_version_links_create
    parameters:
      - in: path
        name: project_id
        required: true
        schema: {type: integer}
      - in: header
        name: Idempotency-Key
        required: false
        schema: {type: string}
        description: Optional replay identity, trimmed then validated as 1–200 ASCII letters, digits, dot, underscore or hyphen. Reuse with a different payload returns 409.
    responses:
      '200':
        description: Success
        content: {application/json: {schema: {$ref: ../schemas/traceability.yaml#/RequirementVersionLink}}}
      '400':
        $ref: ../components/responses.yaml#/ApiError
      '401':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '403':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '404':
        $ref: ../components/responses.yaml#/ApiError
      '409':
        $ref: ../components/responses.yaml#/ApiError
      '422':
        description: Authentication, authorization, CSRF or Rocket input failure; body may be empty or framework-generated.
      '500':
        $ref: ../components/responses.yaml#/ApiError
    description: >-
      Audited api/requirement_version_links.rs, models and RequirementService. Project-bound source/target
      versions; optional Idempotency-Key is supported on create, reused payload mismatches return 409. Both
      variants share this contract.
    security:
      - cookieAuth: []
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json: {schema: {type: object, properties: {source_version_id: {type: integer}, target_version_id: {type: integer}, link_type: {type: string}, rationale: {anyOf: [{type: string}, {type: 'null'}]}, metadata: {anyOf: [{}, {type: 'null'}]}}, required: [source_version_id, target_version_id, link_type], additionalProperties: true}}
    x-marreq-bearer-scopes:
      - traceability:write
    x-marreq-authorization: project-membership;EditRequirements;not-archived
    x-marreq-csrf: session-csrf
  get:
