ProjectStatus:
  type: string
  enum:
    - Active
    - Completed
    - OnHold
    - Cancelled
Applicability:
  type: object
  properties:
    id:
      type: integer
    project_id:
      type: integer
    title:
      type: string
    description:
      type: string
    tag:
      type: string
  required:
    - id
    - project_id
    - title
    - description
    - tag
  additionalProperties: true
NewApplicability:
  type: object
  properties:
    id:
      anyOf:
        - {type: integer}
        - {type: 'null'}
    project_id:
      type: integer
    title:
      type: string
    description:
      type: string
    tag:
      type: string
  required:
    - title
    - description
    - tag
    - project_id
  additionalProperties: true
Category:
