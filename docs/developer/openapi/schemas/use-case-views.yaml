use_cases_LinkView_response:
  type: object
  properties:
    id:
      type: integer
    element_id:
      anyOf:
        - {type: string}
        - {type: 'null'}
    element_label:
      anyOf:
        - {type: string}
        - {type: 'null'}
    target_type:
      type: string
      enum:
        - requirement
        - verification
    requirement_id:
      anyOf:
        - {type: integer}
        - {type: 'null'}
    verification_id:
      anyOf:
        - {type: integer}
        - {type: 'null'}
    target_reference_code:
      type: string
    target_title:
      type: string
    rationale:
      anyOf:
        - {type: string}
        - {type: 'null'}
    suspect:
      type: boolean
    suspect_at:
      anyOf:
        - {type: string}
        - {type: 'null'}
    suspect_reason:
      anyOf:
        - {type: string}
        - {type: 'null'}
    linked_requirement_version_id:
      anyOf:
        - {type: integer}
        - {type: 'null'}
    current_requirement_version_id:
      anyOf:
        - {type: integer}
        - {type: 'null'}
    created_by:
      anyOf:
        - {type: integer}
        - {type: 'null'}
    created_at:
      type: string
  additionalProperties: true
  required:
    - id
    - element_id
    - element_label
    - target_type
    - requirement_id
    - verification_id
    - target_reference_code
    - target_title
    - rationale
    - suspect
    - suspect_at
    - suspect_reason
    - linked_requirement_version_id
    - current_requirement_version_id
    - created_by
    - created_at
