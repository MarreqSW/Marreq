    reviewed_by:
      anyOf:
        - {type: integer}
        - {type: 'null'}
    reviewed_at:
      anyOf:
        - {type: string}
        - {type: 'null'}
    approved_by:
      anyOf:
        - {type: integer}
        - {type: 'null'}
    approved_at:
      anyOf:
        - {type: string}
        - {type: 'null'}
    document:
      $ref: ../schemas/use-cases.yaml#/UseCaseDocumentResponse
