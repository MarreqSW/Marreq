use_cases_UseCaseRow_response:
  type: object
  properties:
    id:
      type: integer
    reference_code:
      type: string
    title:
      type: string
    primary_actor:
      anyOf:
        - {type: string}
        - {type: 'null'}
    step_count:
      type: integer
    alternative_count:
      type: integer
    exception_count:
      type: integer
    approval_state:
      anyOf:
        - {type: string}
        - {type: 'null'}
    current_version_number:
      anyOf:
        - {type: integer}
        - {type: 'null'}
    has_draft:
      type: boolean
    link_count:
      type: integer
    suspect_count:
      type: integer
    updated_at:
      type: string
  additionalProperties: true
  required:
    - id
    - reference_code
    - title
    - primary_actor
    - step_count
    - alternative_count
    - exception_count
    - approval_state
    - current_version_number
    - has_draft
    - link_count
    - suspect_count
    - updated_at
use_cases_NextCode_response:
  type: object
  properties:
    reference_code:
      type: string
  additionalProperties: true
  required:
    - reference_code
use_cases_UseCaseDetail_response:
  type: object
  properties:
    id:
      type: integer
    project_id:
      type: integer
    reference_code:
      type: string
    title:
      type: string
    created_by:
      anyOf:
        - {type: integer}
        - {type: 'null'}
    created_at:
      type: string
    updated_at:
      type: string
    current_version:
      anyOf:
        - {$ref: ../schemas/use-case-views.yaml#/use_cases_VersionView_response}
        - {type: 'null'}
    draft:
      anyOf:
        - {$ref: ../schemas/use-case-views.yaml#/use_cases_DraftSummary_response}
        - {type: 'null'}
  additionalProperties: true
  required:
    - id
    - project_id
    - reference_code
    - title
    - created_by
    - created_at
    - updated_at
    - current_version
    - draft
use_cases_VersionView_response:
